
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>ナマイキデザイン | 名刺ジェネレーター</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        pixel: ['"DotGothic16"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                        montserrat: ['Montserrat', 'sans-serif'],
                        press: ['"Press Start 2P"', 'cursive']
                    },
                    colors: {
                        namaiki: {
                            ink: '#161A13',
                            lime: '#C9F31D',
                            yellow: '#FFD83D',
                            cream: '#F7F7ED',
                            paper: '#FFFEF7',
                            line: '#D8DEC8',
                            muted: '#59614E'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --ink: #161A13;
            --lime: #C9F31D;
            --yellow: #FFD83D;
            --cream: #F7F7ED;
            --paper: #FFFEF7;
            --line: #D8DEC8;
            --muted: #59614E;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background:
                linear-gradient(rgba(22, 26, 19, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(22, 26, 19, 0.035) 1px, transparent 1px),
                var(--cream);
            background-size: 24px 24px;
            color: var(--ink);
            font-family: 'Noto Sans JP', sans-serif;
        }

        .pixel-font {
            font-family: 'DotGothic16', sans-serif;
            letter-spacing: .06em;
        }

        .mono-font {
            font-family: 'IBM Plex Mono', monospace;
        }

        .pixel-label {
            font-family: 'Press Start 2P', 'IBM Plex Mono', monospace;
            letter-spacing: .06em;
        }

        .brand-stripe {
            background: repeating-linear-gradient(
                90deg,
                var(--lime) 0 14px,
                var(--yellow) 14px 26px,
                var(--ink) 26px 34px,
                transparent 34px 42px
            );
        }

        .a4-paper {
            width: 210mm;
            height: 297mm;
            background: #fff;
            box-shadow: 0 12px 40px rgba(22, 26, 19, 0.16);
            margin: 0 auto;
            padding: 26mm 20mm;
            display: grid;
            grid-template-columns: repeat(2, 85mm);
            grid-template-rows: repeat(5, 49mm);
            gap: 0;
            transform-origin: top center;
            border-radius: 2px;
        }

        .business-card {
            width: 85mm;
            height: 49mm;
            background: var(--paper);
            border: .5px dashed #CBD2BD;
            overflow: hidden;
            position: relative;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--ink);
            isolation: isolate;
        }

        /* ---------------- 背景模様 ---------------- */
        .card-noise {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
            background-image: radial-gradient(rgba(22, 26, 19, 0.08) 0.65px, transparent 0.65px);
            background-size: 2.2mm 2.2mm;
        }

        .card-grid {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 100% 0%, rgba(201, 243, 29, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 0% 100%, rgba(255, 216, 61, 0.14) 0%, transparent 50%);
        }

        .pixel-mark {
            position: absolute;
            right: 3.5mm;
            top: 3.5mm;
            width: 12mm;
            height: 12mm;
            z-index: 1;
            pointer-events: none;
            opacity: 0.08;
            background-image:
                linear-gradient(to right, var(--ink) 1px, transparent 1px),
                linear-gradient(to bottom, var(--ink) 1px, transparent 1px);
            background-size: 2mm 2mm;
        }

        .corner-block {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 18mm;
            height: 18mm;
            z-index: 0;
            opacity: 0.04;
            background: repeating-linear-gradient(-45deg, var(--ink), var(--ink) 1px, transparent 1px, transparent 2.5mm);
        }

        .card-edge {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2.4mm;
            z-index: 5;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-a) 46%, var(--accent-b) 46%, var(--accent-b) 78%, var(--ink) 78%);
        }

        /* ---------------- レイアウト＆余白調整 ---------------- */
        .card-inner {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 4.2mm 4.8mm 3.8mm 4.8mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--line);
            padding-bottom: 1.5mm;
        }

        .logo-lockup {
            display: flex;
            align-items: center;
            gap: 2mm;
            min-width: 0;
        }

        .logo-lockup img {
            width: 6.2mm;
            height: 6.2mm;
            object-fit: contain;
            flex: none;
        }

        .brand-name {
            font-family: 'DotGothic16', sans-serif;
            font-size: 3.2mm;
            line-height: 1;
            letter-spacing: .08em;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-sub {
            margin-top: .6mm;
            color: var(--muted);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.35mm;
            line-height: 1;
            letter-spacing: .05em;
        }

        .card-main {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 15mm;
            gap: 3mm;
            align-items: center;
            padding: 1.2mm 0;
        }

        .name-area {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 役職・名前部分のマージンを広げて余白を確保 */
        .display-role {
            align-self: flex-start;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.45mm;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: .08em;
            line-height: 1;
            text-transform: uppercase;
            padding: 0.8mm 1.3mm;
            border-left: 1.2mm solid var(--accent-a);
            background: linear-gradient(90deg, rgba(201,243,29,.18), rgba(255,216,61,.08));
            margin-bottom: 2.2mm;
        }

        .display-spell {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.55mm;
            font-weight: 700;
            letter-spacing: .16em;
            color: #727A6C;
            line-height: 1;
            margin-bottom: 1.6mm;
        }

        .display-name {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 5.4mm;
            font-weight: 900;
            letter-spacing: .08em;
            line-height: 1.05;
            color: var(--ink);
            white-space: nowrap;
        }

        .specialty-wrap {
            margin-top: 2.4mm;
            display: flex;
            align-items: center;
            gap: 1.2mm;
            min-width: 0;
        }

        .specialty-dot {
            flex: none;
            width: 1.8mm;
            height: 1.8mm;
            background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
            box-shadow: 0.8mm 0.8mm 0 rgba(22,26,19,.10);
        }

        .display-specialty {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.85mm;
            font-weight: 700;
            letter-spacing: .02em;
            color: #3F4639;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .qr-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8mm;
        }

        .qr-box {
            width: 13.5mm;
            height: 13.5mm;
            padding: 0.8mm;
            background: #fff;
            border: 1px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-box::before,
        .qr-box::after {
            content: '';
            position: absolute;
            width: 2.2mm;
            height: 2.2mm;
            border-color: var(--ink);
            pointer-events: none;
        }

        .qr-box::before {
            left: -1px;
            top: -1px;
            border-left: 2px solid;
            border-top: 2px solid;
        }

        .qr-box::after {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid;
            border-bottom: 2px solid;
        }

        .qr-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-placeholder {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 0.5mm;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.1mm;
            line-height: 1.15;
            color: #7C8476;
        }

        .qr-caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.1mm;
            font-weight: 600;
            letter-spacing: .08em;
            color: #697164;
            line-height: 1;
            text-align: center;
        }

        .contact-area {
            padding-top: 1.5mm;
            border-top: 0.5px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 0.7mm;
            min-width: 0;
        }

        .contact-line {
            display: flex;
            align-items: center;
            gap: 1.2mm;
            min-width: 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.38mm;
            line-height: 1.1;
            color: #475042;
        }

        .contact-line i {
            width: 2.2mm;
            color: var(--ink);
            font-size: 1.6mm;
            flex: none;
            text-align: center;
        }

        .contact-value {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .contact-value.empty {
            color: #A0A69C;
        }

        .contact-side-note {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.05mm;
            line-height: 1.2;
            letter-spacing: .06em;
            color: #8C9488;
            text-align: right;
            white-space: nowrap;
        }

        .helper-scroll {
            scrollbar-width: thin;
            scrollbar-color: #C5CCBA transparent;
        }

        .helper-scroll::-webkit-scrollbar { width: 7px; }
        .helper-scroll::-webkit-scrollbar-thumb { background: #C5CCBA; border-radius: 8px; }

        @media print {
            body { background: #fff !important; }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

<header class="sticky top-0 z-30 border-b border-black/10 bg-white/95 backdrop-blur shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-lg border border-black/10 bg-lime-100 flex items-center justify-center p-1.5 shadow-sm overflow-hidden">
                <img src="https://ataro-qqq.github.io/carder-namaiki01/rogo01.png" alt="ナマイキデザイン ロゴ" class="max-h-full max-w-full object-contain" crossorigin="anonymous" onerror="this.onerror=null;this.src='https://placehold.co/100x100/C9F31D/161A13?text=N'">
            </div>
            <div class="min-w-0">
                <h1 class="font-pixel text-lg font-bold leading-tight tracking-wide">ナマイキデザイン</h1>
                <p class="text-[10px] sm:text-xs text-slate-500 font-mono uppercase tracking-[0.16em]">PERSONAL CREATIVE STUDIO / BUSINESS CARD GENERATOR</p>
            </div>
        </div>

        <div class="hidden sm:flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-mono font-semibold bg-lime-100 text-lime-900 border border-lime-300">
                <i class="fa-solid fa-code"></i> WEB DESIGN
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-mono font-semibold bg-amber-100 text-amber-900 border border-amber-300">
                <i class="fa-solid fa-wave-square"></i> CREATIVE ARTS
            </span>
        </div>
    </div>
    <div class="brand-stripe h-2 w-full"></div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <section class="lg:col-span-5 xl:col-span-4 flex flex-col gap-5">
        <div class="bg-white rounded-xl border border-black/10 shadow-sm p-4">
            <div class="flex items-center justify-between gap-3 mb-3">
                <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-md bg-lime-100 text-lime-800 border border-lime-300 flex items-center justify-center">
                        <i class="fa-solid fa-sliders"></i>
                    </span>
                    A4用紙の割付設定
                </h2>
                <span class="text-[10px] font-mono font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">85 × 49 mm / 10面</span>
            </div>
            <label for="layout-type" class="block text-[10px] font-semibold text-slate-600 mb-1 uppercase tracking-wide">割り当てパターン</label>
            <select id="layout-type" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-xs font-medium text-slate-800 p-2.5 focus:outline-none focus:ring-2 focus:ring-lime-400 focus:bg-white transition-all">
                <option value="1">1種類（1名の名刺を10枚）</option>
                <option value="2">2種類（2名の名刺を5枚ずつ / 左右列）</option>
                <option value="5">5種類（5名の名刺を2枚ずつ / 各行）</option>
            </select>
        </div>

        <div id="forms-container" class="space-y-4 max-h-[calc(100vh-315px)] overflow-y-auto pr-1 helper-scroll"></div>

        <div class="bg-white rounded-xl border border-black/10 shadow-sm p-4 flex flex-col gap-3">
            <button onclick="printCards()" class="w-full bg-slate-900 hover:bg-black active:scale-[0.99] text-white font-bold py-2.5 px-4 rounded-lg shadow transition-all flex items-center justify-center gap-2 text-xs">
                <i class="fa-solid fa-print"></i> 印刷する（A4）
            </button>
            <button onclick="generatePDF()" id="pdf-btn" class="w-full bg-lime-400 hover:bg-lime-300 active:scale-[0.99] text-slate-950 font-bold py-2.5 px-4 rounded-lg shadow transition-all flex items-center justify-center gap-2 text-xs border border-lime-500">
                <i class="fa-solid fa-file-pdf"></i> 高画質PDFを出力する
            </button>
            <p class="text-[10px] text-slate-400 text-center flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-circle-info"></i> A4 / 85×49mm（3号名刺）/ 10面
            </p>
        </div>
    </section>

    <section class="lg:col-span-7 xl:col-span-8 bg-slate-200/70 border border-slate-300 rounded-xl p-4 flex flex-col min-h-[600px] overflow-hidden shadow-inner">
        <div class="bg-white/90 backdrop-blur rounded-lg p-3 border border-slate-200 mb-4 flex items-center justify-between shadow-sm gap-3">
            <div class="flex items-center gap-2 text-xs font-bold text-slate-700">
                <span class="w-7 h-7 rounded-md bg-lime-100 text-lime-800 border border-lime-300 flex items-center justify-center">
                    <i class="fa-solid fa-eye"></i>
                </span>
                A4 印刷プレビュー
            </div>
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline text-xs text-slate-500 font-medium"><i class="fa-solid fa-magnifying-glass"></i> 拡大率</span>
                <input type="range" id="zoom-slider" min="0.45" max="1.1" step="0.05" value="0.75" class="w-28 accent-lime-500 cursor-pointer">
                <span id="zoom-val" class="text-xs font-mono text-slate-600 w-8">75%</span>
            </div>
        </div>

        <div id="preview-container" class="flex-1 overflow-auto flex justify-center items-start p-4 bg-slate-300/40 rounded-lg border border-slate-200/80">
            <div id="a4-preview" class="a4-paper transition-transform duration-200 ease-out"></div>
        </div>
    </section>
</main>

<footer class="bg-white border-t border-black/10 py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-[10px] text-slate-500">
        <p class="font-mono tracking-wide">© 2026 ナマイキデザイン / PERSONAL CREATIVE STUDIO — WEB DESIGN / SOUND / SCENARIO</p>
    </div>
</footer>

<template id="card-template">
    <div class="business-card" style="--accent-a:#C9F31D; --accent-b:#FFD83D;">
        <div class="card-noise"></div>
        <div class="card-grid"></div>
        <div class="card-edge"></div>
        <div class="pixel-mark"></div>
        <div class="corner-block"></div>

        <div class="card-inner">
            <div class="logo-header">
                <div class="logo-lockup">
                    <img src="https://ataro-qqq.github.io/carder-namaiki01/rogo01.png" alt="ナマイキデザイン ロゴ" crossorigin="anonymous" onerror="this.style.visibility='hidden'">
                    <div class="min-w-0">
                        <div class="brand-name">ナマイキデザイン</div>
                        <div class="brand-sub">CREATIVE STUDIO</div>
                    </div>
                </div>
            </div>

            <div class="card-main">
                <div class="name-area">
                    <div class="display-role"><span class="display-role-value">役職</span></div>
                    <div class="display-spell">TARO SOEI</div>
                    <div class="display-name">創英 太郎</div>
                    <div class="specialty-wrap">
                        <span class="specialty-dot"></span>
                        <div class="display-specialty">Webデザイン / 音響 / シナリオ制作</div>
                    </div>
                </div>

                <div class="qr-area">
                    <div class="qr-box">
                        <div class="qr-placeholder">HP URL<br>を入力すると<br>QRを生成</div>
                    </div>
                    <div class="qr-caption">SCAN / WEB</div>
                </div>
            </div>

            <div class="contact-area">
                <div class="contact-list">
                    <div class="contact-line">
                        <i class="fa-regular fa-envelope"></i>
                        <span class="contact-value display-email">mail@example.com</span>
                    </div>
                    <div class="contact-line">
                        <i class="fa-brands fa-github"></i>
                        <span class="contact-value display-github">github.com/username</span>
                    </div>
                    <div class="contact-line">
                        <i class="fa-solid fa-link"></i>
                        <span class="contact-value display-url">https://example.com</span>
                    </div>
                </div>
                <div class="contact-side-note">WEB / GITHUB / MAIL</div>
            </div>
        </div>
    </div>
</template>

            },
            {

            },
            {

            a4Preview.style.transform = `scale(${val})`;
            zoomVal.textContent = `${Math.round(val * 100)}%`;
        });

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function createFormHTML(index, total) {
            const member = sampleMembers[(index - 1) % sampleMembers.length];
            const copiesText = total === 1 ? '10枚出力' : (total === 2 ? '5枚出力' : '2枚出力');

            return `
                <div class="bg-white border border-black/10 rounded-xl p-4 shadow-sm transition-all hover:border-lime-400" id="form-group-${index}">
                    <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-100">
                        <h3 class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
                            <span class="w-5 h-5 rounded-full bg-lime-100 text-lime-900 border border-lime-300 flex items-center justify-center text-[11px] font-bold">${index}</span>
                            メンバー ${index} 情報
                        </h3>
                        <span class="text-[10px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${copiesText}</span>
                    </div>

                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500">役職</label>
                                <input type="text" data-index="${index}" data-field="role" value="${escapeHTML(member.role)}" class="mt-0.5 w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500">氏名（漢字）</label>
                                <input type="text" data-index="${index}" data-field="name" value="${escapeHTML(member.name)}" class="mt-0.5 w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500">英語表記（大文字推奨）</label>
                            <input type="text" data-index="${index}" data-field="spell" value="${escapeHTML(member.spell)}" class="mt-0.5 w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs uppercase text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none" spellcheck="false">
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500">専門分野</label>
                            <input type="text" data-index="${index}" data-field="specialty" value="${escapeHTML(member.specialty)}" class="mt-0.5 w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none">
                        </div>

                        <div class="pt-2 border-t border-slate-100">
                            <p class="text-[9px] font-bold text-slate-400 mb-1.5 tracking-wide">CONTACT / QR</p>
                            <div class="space-y-1.5">
                                <input type="email" data-index="${index}" data-field="email" value="${escapeHTML(member.email)}" placeholder="メールアドレス" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none">
                                <input type="text" data-index="${index}" data-field="github" value="${escapeHTML(member.github)}" placeholder="github.com/username" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none" spellcheck="false">
                                <input type="url" data-index="${index}" data-field="homepage" value="${escapeHTML(member.homepage)}" placeholder="https://example.com" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:bg-white focus:border-lime-500 focus:outline-none" spellcheck="false">
                            </div>
                            <p class="text-[9px] text-slate-400 mt-1.5 flex items-start gap-1"><i class="fa-solid fa-qrcode mt-[1px]"></i><span>ホームページURLを入力すると、名刺右下にQRコードを生成します。</span></p>
                        </div>

                        <div class="pt-2 border-t border-slate-100">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">ワンポイント2色</label>
                            <div class="grid grid-cols-2 gap-2 items-center">
                                <div class="flex items-center gap-1.5 bg-slate-50 p-1 rounded border border-slate-200">
                                    <input type="color" data-index="${index}" data-field="color1" value="${member.color1}" class="w-6 h-6 border-0 bg-transparent cursor-pointer rounded">
                                    <span class="text-[10px] text-slate-600 font-medium">左色</span>
                                </div>
                                <div class="flex items-center gap-1.5 bg-slate-50 p-1 rounded border border-slate-200">
                                    <input type="color" data-index="${index}" data-field="color2" value="${member.color2}" class="w-6 h-6 border-0 bg-transparent cursor-pointer rounded">
                                    <span class="text-[10px] text-slate-600 font-medium">右色</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getFormData(typeCount) {
            const formData = {};
            for (let i = 1; i <= typeCount; i++) {
                const read = (field) => document.querySelector(`input[data-index="${i}"][data-field="${field}"]`)?.value ?? '';
                let spell = read('spell').toUpperCase();
                const homepage = read('homepage').trim();

                formData[i] = {
                    role: read('role'),
                    name: read('name'),
                    spell,
                    specialty: read('specialty'),
                    email: read('email'),
                    github: read('github'),
                    homepage,
                    color1: read('color1') || '#C9F31D',
                    color2: read('color2') || '#FFD83D'
                };
            }
            return formData;
        }

        function normalizeURL(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            if (/^https?:\/\//i.test(raw)) return raw;
            return `https://${raw}`;
        }

        function makeQR(container, url) {
            container.innerHTML = '';
            const normalized = normalizeURL(url);
            if (!normalized) {
                const placeholder = document.createElement('div');
                placeholder.className = 'qr-placeholder';
                placeholder.innerHTML = 'HP URL<br>を入力すると<br>QRを生成';
                container.appendChild(placeholder);
                return;
            }

            try {
                const qr = qrcode(0, 'M');
                qr.addData(normalized);
                qr.make();
                container.innerHTML = qr.createSvgTag({
                    scalable: true,
                    margin: 0
                });
                const svg = container.querySelector('svg');
                if (svg) {
                    svg.setAttribute('shape-rendering', 'crispEdges');
                    svg.setAttribute('aria-label', `QR code for ${normalized}`);
                    svg.setAttribute('role', 'img');
                }
            } catch (error) {
                console.error('QR generation error:', error);
                const fallback = document.createElement('div');
                fallback.className = 'qr-placeholder';
                fallback.textContent = 'QR生成エラー';
                container.appendChild(fallback);
            }
        }

        function renderPreview() {
            const typeCount = Number(layoutSelect.value);
            const formData = getFormData(typeCount);
            const cards = a4Preview.querySelectorAll('.business-card');

            cards.forEach((card, index) => {
                let personIndex = 1;
                if (typeCount === 1) {
                    personIndex = 1;
                } else if (typeCount === 2) {
                    personIndex = (index % 2 === 0) ? 1 : 2;
                } else if (typeCount === 5) {
                    personIndex = Math.floor(index / 2) + 1;
                }

                const data = formData[personIndex];
                if (!data) return;

                card.style.setProperty('--accent-a', data.color1);
                card.style.setProperty('--accent-b', data.color2);

                card.querySelector('.display-role-value').textContent = data.role || 'ROLE';
                card.querySelector('.display-spell').textContent = data.spell || ' ';
                card.querySelector('.display-name').textContent = data.name || ' ';
                card.querySelector('.display-specialty').textContent = data.specialty || ' ';

                const email = card.querySelector('.display-email');
                const github = card.querySelector('.display-github');
                const url = card.querySelector('.display-url');

                email.textContent = data.email || 'mail@example.com';
                github.textContent = data.github || 'github.com/username';
                url.textContent = data.homepage || 'ホームページURL';

                email.classList.toggle('empty', !data.email);
                github.classList.toggle('empty', !data.github);
                url.classList.toggle('empty', !data.homepage);

                makeQR(card.querySelector('.qr-box'), data.homepage);
            });
        }

        function updateLayout() {
            const typeCount = Number(layoutSelect.value);
            formsContainer.innerHTML = '';
            for (let i = 1; i <= typeCount; i++) {
                formsContainer.insertAdjacentHTML('beforeend', createFormHTML(i, typeCount));
            }

            a4Preview.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                a4Preview.appendChild(cardTemplate.content.cloneNode(true));
            }

            document.querySelectorAll('#forms-container input').forEach(input => {
                input.addEventListener('input', (e) => {
                    if (e.target.dataset.field === 'spell') {
                        const pos = e.target.selectionStart;
                        e.target.value = e.target.value.toUpperCase();
                        try { e.target.setSelectionRange(pos, pos); } catch (_) {}
                    }
                    renderPreview();
                });
            });

            renderPreview();
        }

        window.printCards = function () {
            const styleElements = document.querySelectorAll('style, link[rel="stylesheet"]');
            let stylesHTML = '';
            styleElements.forEach(el => stylesHTML += el.outerHTML);

            const previewElement = document.getElementById('a4-preview');
            let iframe = document.getElementById('print-iframe');
            if (iframe) iframe.remove();

            iframe = document.createElement('iframe');
            iframe.id = 'print-iframe';
            iframe.style.position = 'fixed';
            iframe.style.top = '-10000px';
            iframe.style.left = '-10000px';
            iframe.style.width = '210mm';
            iframe.style.height = '297mm';
            iframe.style.border = 'none';
            document.body.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html lang="ja">
                <head>
                    <meta charset="UTF-8">
                    <title>ナマイキデザイン 名刺印刷</title>
                    ${stylesHTML}
                    <style>
                        html, body {
                            margin: 0 !important;
                            padding: 0 !important;
                            width: 210mm;
                            height: 297mm;
                            background: #ffffff !important;
                        }
                        .a4-paper {
                            transform: scale(1) !important;
                            box-shadow: none !important;
                            margin: 0 !important;
                        }
                        @page { size: A4 portrait; margin: 0; }
                        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                    </style>
                </head>
                <body>
                    ${previewElement.outerHTML}
                    <script>
                        setTimeout(() => {
                            window.focus();
                            window.print();
                        }, 700);
                    <\/script>
                </body>
                </html>
            `);
            doc.close();
        };

        window.generatePDF = function () {
            const sourceElement = document.getElementById('a4-preview');
            const btn = document.getElementById('pdf-btn');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PDF作成中...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const clone = sourceElement.cloneNode(true);
            clone.id = 'pdf-render-clone';
            Object.assign(clone.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                zIndex: '-9999',
                transform: 'scale(1)',
                boxShadow: 'none',
                margin: '0',
                background: '#ffffff',
                width: '210mm',
                height: '297mm',
                overflow: 'visible'
            });

            document.body.appendChild(clone);

            const opt = {
                margin: 0,
                filename: 'Namaiki_Design_BusinessCards_2026.pdf',
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: {
                    scale: 4,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff',
                    scrollY: 0,
                    scrollX: 0,
                    logging: false,
                    width: clone.offsetWidth,
                    height: clone.offsetHeight
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(clone).save().then(() => {
                    clone.remove();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }).catch(err => {
                    console.error('PDF generation error:', err);
                    clone.remove();
                    btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> エラー発生';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    }, 2500);
                });
            }, 300);
        };

        layoutSelect.addEventListener('change', updateLayout);
        updateLayout();
    });
</script>

</body>
</html>
